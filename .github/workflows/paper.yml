# Live paper trading + wallet finder for the website. Simulated only, read-only public data.
# GitHub's own schedule proved unreliable, so one run loops every 30 min for ~5.5 h and then starts the next run itself.
# The schedule below stays as a backup in case the chain ever breaks. Data goes to the branch `paper-data`.
name: Paper trading
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser
        working-directory: site/paper
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Trade on paper every 30 min, find wallets every 6 h
        run: |
          mkdir -p work
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/paper-data"
          curl -sSf "$raw/state.json" -o work/state.json || true
          curl -sSf "$raw/wallets.json" -o work/wallets.json || true
          node site/paper/wallets.mjs work/wallets.json || echo "wallet finder failed this round"
          site/paper/publish.sh "wallets" work/wallets.json || true
          for i in $(seq 1 11); do
            start=$(date +%s)
            node site/paper/run.mjs site work/state.json || echo "paper run $i failed"
            site/paper/publish.sh "paper state" work/state.json || echo "publish $i failed"
            left=$(( 1800 - ($(date +%s) - start) ))
            if [ "$i" -lt 11 ] && [ "$left" -gt 0 ]; then sleep "$left"; fi
          done
      - name: Start the next run
        if: always()
        run: gh workflow run paper.yml --repo "$GITHUB_REPOSITORY" --ref main
