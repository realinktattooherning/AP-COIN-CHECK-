# Wallet finder for the website: 4 times a day, first buyers of recent pump.fun runners that still trade and are not bots.
# Read-only public data. Writes wallets.json to the paper-data branch (same group as the paper bot, so they never collide).
name: Wallet finder
# Normally the paper bot runs the wallet finder every 6 h; this workflow is for a manual extra run.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wallets
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Load paper-data
        run: |
          git clone --depth 1 --branch paper-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || mkdir data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find wallets
        run: node site/paper/wallets.mjs data/wallets.json
      - name: Publish to paper-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/paper/publish.sh "wallets" data/wallets.json
