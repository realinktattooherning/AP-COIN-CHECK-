<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden;margin:0}
.og{position:relative;width:1200px;height:630px;padding:64px 70px;box-sizing:border-box;isolation:isolate}
.og .rug{position:absolute;inset:0;z-index:-1;background:url(knit.svg) 0 0/168px auto;opacity:.55;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 75%)}
.og h1{font-size:104px;margin-top:30px}
.og .brand img{width:58px;height:58px}.og .wordmark{font-size:46px}
.og .url{position:absolute;left:70px;bottom:56px;font:600 22px var(--mono);font-stretch:87.5%;color:var(--mist);letter-spacing:.06em}
.og .plate{position:absolute;right:90px;top:150px;--size:150px;transform:rotate(-5deg)}
.og .beam{top:62%;animation:none}
</style></head><body>
<div class="og"><div class="rug"></div><div class="beam"></div>
<div class="brand"><img src="logo.svg" alt=""><span class="wordmark"><b>DK</b>RUGSCAN</span></div>
<h1>Scan it<span class="red" style="display:block">before you<br>ape it.</span></h1>
<div class="plate plate-stop"><span class="plate-holes"></span><span class="plate-no">2<small>/10</small></span><span class="plate-label">Don't buy</span></div>
<div class="url">24 CHECKS · ONE SCORE · DKRUGSCAN.NETLIFY.APP</div>
</div></body></html>
